<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Epcot Sips</title>
  <meta name="description" content="Our family's drink passport for EPCOT — always-current festival menus on a live park map" />
  <meta name="theme-color" content="#15181b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Epcot Sips" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-tab="map">
  <header class="top">
    <span class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="11" r="7.5"/><path d="M4.5 11h15M5.5 7.3h13M5.5 14.7h13M12 3.5 7.6 11 12 18.5 16.4 11z"/><path d="M8 18.5 6.5 21.5M16 18.5l1.5 3M12 18.5v3"/></svg></span>
    <button class="fest" id="festBtn" aria-label="Festival and menu info">
      <span class="eyebrow">Epcot Sips</span>
      <span class="fest-name" id="festName">Loading…</span>
      <span class="fest-meta" id="festMeta"></span>
    </button>
    <button id="settingsBtn" class="hdr-btn" aria-label="Settings" data-icon="gear"></button>
    <button id="meBtn" class="me-chip" aria-label="Your profile"><span id="meAvatar"></span><span id="meName">Join</span></button>
  </header>

  <!-- MAP -->
  <section id="mapView" class="map-view" aria-label="EPCOT map">
    <div id="mapStage" class="map-stage">
      <svg id="map" role="img" aria-label="Map of EPCOT with drink locations"></svg>
      <div id="overlay" class="map-overlay"></div>
    </div>
    <div class="map-ui" id="mapFilters"></div>
    <div class="map-tools">
      <button class="tool" id="zoomIn" aria-label="Zoom in" data-icon="plus"></button>
      <button class="tool" id="zoomOut" aria-label="Zoom out" data-icon="minus"></button>
      <button class="tool" id="locBtn" aria-label="Show where I am" data-icon="locate"></button>
      <button class="tool" id="fitBtn" aria-label="Reset map" data-icon="fit"></button>
    </div>
    <svg class="compass" viewBox="-26 -26 52 52" aria-label="North is at the bottom" role="img">
      <circle r="24" fill="#fbf7ec" stroke="#15181b" stroke-width="1.5"/>
      <circle r="19.5" fill="none" stroke="#15181b" stroke-width=".6" stroke-dasharray="1 2.2"/>
      <path d="M0 11 3.6 0 0-17-3.6 0z" fill="#15181b"/><path d="M0 11 3.6 0h-7.2z" fill="#a3263a"/>
      <path d="M-17 0 0-2.6 17 0 0 2.6z" fill="#8a8f96"/>
      <text y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="8" fill="#a3263a">N</text>
    </svg>
    <div class="scale" id="scale" aria-hidden="true"><span id="scaleT"></span><div class="bar" id="scaleBar"></div><small class="osm">© OpenStreetMap</small></div>
    <div id="drawer" class="drawer" data-state="peek">
      <button class="drawer-grip" id="drawerGrip" aria-label="Expand or collapse"></button>
      <div id="drawerBody" class="drawer-body"></div>
    </div>
  </section>

  <!-- OTHER VIEWS -->
  <main id="view" class="view" tabindex="-1"></main>

  <button id="addBtn" class="fab" aria-label="Add a drink the menu is missing" data-icon="plus"></button>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="map" data-icon="map">Map</button>
    <button data-tab="list" data-icon="list">Menu</button>
    <button data-tab="family" data-icon="family">Family</button>
    <button data-tab="buzz" data-icon="gauge">Buzz</button>
    <button data-tab="passport" data-icon="passport">Passport</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
